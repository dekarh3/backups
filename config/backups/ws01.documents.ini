[backup]
client = ws01
name = documents
enabled = true

repository = /ws01/documents
repository_url = https://backup-srv:8443/ws01/documents

schedule = 0 22 * * *

quota_gb = 500

script = /opt/backups/scripts/ws01.documents.py
script_mode = file
script_version = 12
backup_prepare_timeout_sec = 600

retention_days = 31
retention_monthly_months = 12

restic_extra_args = --exclude-caches --exclude-if-present=.nobackup

max_network_kbit_per_sec = 50000

respect_calendar = true
