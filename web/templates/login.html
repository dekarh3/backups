{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/login">
        <div style="margin-bottom: 15px;">
            <label>Username:</label><br>
            <input type="text" name="username" required style="width: 300px; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>Password:</label><br>
            <input type="password" name="password" required style="width: 300px; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px;">
            <label>2FA Code (if enabled):</label><br>
            <input type="text" name="totp_code" style="width: 300px; padding: 8px;">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</div>
{% endblock %}
