name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov httpx pytest-asyncio
        
    - name: Run Unit Tests (API)
      run: |
        python -m pytest tests/test_api.py -v --cov=server --cov-report=xml:coverage_api.xml
        
    - name: Run Unit Tests (Worker)
      run: |
        python -m pytest tests/test_worker.py -v --cov=client --cov-report=xml:coverage_worker.xml --cov-append
        
    - name: Run Integration Tests
      run: |
        python -m pytest tests/test_integration.py -v --cov-report=xml:coverage_integration.xml --cov-append
        
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage*.xml
        retention-days: 5

    - name: Test Summary
      if: always()
      run: echo "All tests completed."
